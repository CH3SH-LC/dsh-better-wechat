name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wechat-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.10'
            node: '22'
          - os: windows-latest
            python: '3.13'
            node: '24'
          - os: ubuntu-latest
            python: '3.13'
            node: '22'
          - os: macos-latest
            python: '3.13'
            node: '22'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install public test dependencies
        run: python -m pip install --disable-pip-version-check -r collector/requirements.txt
      - name: Complete synthetic verification
        run: python -X utf8 -B tools/check.py
      - name: Build verified source archive
        run: python -X utf8 -B tools/release.py
      - name: Retain source package and hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: source-${{ matrix.os }}-py${{ matrix.python }}-node${{ matrix.node }}
          path: |
            dist/dsh-better-wechat-*.zip
            dist/dsh-better-wechat-*.manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
