name: Bug report / 问题反馈
description: 使用固定错误码和合成材料复现；不要提交真实聊天。
body:
  - type: markdown
    attributes:
      value: 请勿上传数据库、采集日志、账号、用户名、个人路径或截图中的聊天。可用 setup.py --doctor --json 获取安全环境报告。隐私漏洞请按 SECURITY.md 私下报告。
  - type: input
    id: version
    attributes:
      label: 插件、DSH、Python 和系统版本
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 发生在哪一步
      options:
        - 安装或加载
        - 第一步固定采集
        - 第二步读取或分析
        - 发布或合成测试
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、期望结果、实际结果
      description: 使用虚构会话名和合成消息。
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: 固定错误码或只读诊断
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 未附真实聊天、用户名、路径、数据库、日志或凭据
          required: true
