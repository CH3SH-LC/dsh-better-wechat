name: Feature request / 功能建议
description: 描述需要解决的问题和可复现的合成场景。
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期行为与示例
      description: 请使用虚构数据，并说明属于固定采集还是文本分析。
    validations:
      required: true
